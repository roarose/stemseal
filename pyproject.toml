[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stemseal"
version = "0.2.1"
description = "Verified, locked calculation cells that small LLMs call instead of guessing. Local, no server, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.scripts]
stemseal = "stemseal.cli:main"
stemseal-mcp = "stemseal.mcp:main"

[tool.setuptools]
packages = ["stemseal"]

[tool.setuptools.package-data]
stemseal = ["guides/*.json", "cells/*/*/*.py", "cells/*/*/*.json"]
